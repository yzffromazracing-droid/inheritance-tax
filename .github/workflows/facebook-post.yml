# 辞書のテーマを1日1件、図解カード付きで Facebook ページに投稿する。
#
# - 毎日 15:47（日本時間）に投稿する。GitHub の予約は毎時ちょうどに集中して遅れたり実行されなかったりするため、
#   混まない分に予約している（遅れても16時前後に投稿される）
# - その日（日本時間）にすでに投稿していれば投稿しない（予約が遅れて起動したときや、強制実行と重なったときの二重投稿を防ぐ）。
#   日付を指定した手動実行と、投稿しない試し（dry_run）では確かめない
# - Actions 画面の「Run workflow」からも実行できる。既定は「投稿せず本文と画像だけ作る」（dry_run）。
#   作った画像は実行結果の Artifacts（facebook-card）からダウンロードできる
#
# リポジトリの Settings → Secrets and variables → Actions に、次の2つを Secret として登録する。
#   FB_PAGE_ID           : 投稿先の Facebook ページID
#   FB_PAGE_ACCESS_TOKEN : ページアクセストークン（pages_manage_posts 権限）
name: Facebook への毎日の投稿

on:
  schedule:
    - cron: "47 6 * * *" # 毎日 15:47（日本時間）。UTC では 6:47
  workflow_dispatch:
    inputs:
      dry_run:
        description: 投稿せずに本文と画像だけ作る
        type: boolean
        default: true
      date:
        description: この日（日本時間、YYYY-MM-DD）のテーマを使う（空欄なら今日）
        type: string
        default: ""

permissions:
  contents: read
  actions: read # 今日すでに投稿したかを実行ログで確かめるため

concurrency:
  group: facebook-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin fonts-noto-cjk >/dev/null

      - name: テスト
        run: python3 -m unittest discover -s social

      - name: 今日すでに投稿したか確かめる
        id: guard
        if: inputs.dry_run != true && !inputs.date
        run: python3 social/already_posted.py
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: 図解カードを作る
        if: steps.guard.outputs.skip != 'true'
        # 画像が作れなくても文章だけで投稿する
        run: python3 social/facebook_image.py "$RUNNER_TEMP/card.png" ${DATE:+--date="$DATE"} || echo "画像を作れなかったため文章だけで投稿します"
        env:
          DATE: ${{ inputs.date }}

      - name: 投稿する
        if: steps.guard.outputs.skip != 'true'
        run: |
          ARGS="--image=$RUNNER_TEMP/card.png"
          [ -n "$DATE" ] && ARGS="$ARGS --date=$DATE"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          python3 social/facebook_post.py $ARGS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DATE: ${{ inputs.date }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}

      - name: 画像を保存する
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: facebook-card
          path: ${{ runner.temp }}/card.png
          if-no-files-found: ignore
          retention-days: 7
