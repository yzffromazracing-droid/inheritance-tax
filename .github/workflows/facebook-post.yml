# 辞書のテーマを1日1件、図解カード付きで Facebook ページに投稿する。
#
# - 毎日 16:00（日本時間）に投稿する
# - Actions 画面の「Run workflow」からも実行できる。既定は「投稿せず本文と画像だけ作る」（dry_run）。
#   作った画像は実行結果の Artifacts（facebook-card）からダウンロードできる
#
# リポジトリの Settings → Secrets and variables → Actions に、次の2つを Secret として登録する。
#   FB_PAGE_ID           : 投稿先の Facebook ページID
#   FB_PAGE_ACCESS_TOKEN : ページアクセストークン（pages_manage_posts 権限）
# 投稿に添える辞書の URL を変える場合は、Variables に SITE_URL を登録する（既定は GitHub Pages の URL）。
name: Facebook への毎日の投稿

on:
  schedule:
    - cron: "0 7 * * *" # 毎日 16:00（日本時間）。UTC では 7:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: 投稿せずに本文と画像だけ作る
        type: boolean
        default: true
      date:
        description: この日（日本時間、YYYY-MM-DD）のテーマを使う（空欄なら今日）
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: facebook-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージのインストール
        run: |
          pip install requests
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends librsvg2-bin fonts-noto-cjk >/dev/null

      - name: テスト
        run: python3 -m unittest discover -s social

      - name: 図解カードを作る
        # 画像が作れなくても文章だけで投稿する
        run: python3 social/facebook_image.py "$RUNNER_TEMP/card.png" ${DATE:+--date="$DATE"} || echo "画像を作れなかったため文章だけで投稿します"
        env:
          DATE: ${{ inputs.date }}

      - name: 投稿する
        run: |
          ARGS="--image=$RUNNER_TEMP/card.png"
          [ -n "$DATE" ] && ARGS="$ARGS --date=$DATE"
          [ "$DRY_RUN" = "true" ] && ARGS="$ARGS --dry-run"
          python3 social/facebook_post.py $ARGS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          DATE: ${{ inputs.date }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets.FB_PAGE_ACCESS_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}

      - name: 画像を保存する
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: facebook-card
          path: ${{ runner.temp }}/card.png
          if-no-files-found: ignore
          retention-days: 7
