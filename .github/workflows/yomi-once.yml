# 一時的なワークフロー：辞書データから読み表を生成してこのブランチにコミットする（確認後に削除する）
name: 読み表の生成（一時）

on:
  push:
    branches: [claude/inheritance-tax-dictionary]
    paths: [scraper/build_yomi.py, .github/workflows/yomi-once.yml]

permissions:
  contents: write

jobs:
  yomi:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scraper/requirements-yomi.txt
      - run: python3 scraper/build_yomi.py --from-data
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/yomi.json
          git commit -m "読み表に辞書データ中の用語の読みを追加（SudachiPy で生成）" || echo "変更なし"
          git push
