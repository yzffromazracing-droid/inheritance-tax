# 毎月、国税庁ホームページから通達・タックスアンサー・質疑応答事例・文書回答事例を取得し直し、
# 前回のデータと比べて変更があれば docs/data を更新して GitHub Pages に反映する。
name: 国税庁データの月次更新

on:
  schedule:
    - cron: "17 21 1 * *" # 毎月2日 6:17（日本時間）
  workflow_dispatch: # Actions 画面の「Run workflow」から手動でも実行できる

permissions:
  contents: write # 更新したデータのコミット
  pages: write # GitHub Pages の再ビルド

concurrency:
  group: monthly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - name: 依存パッケージのインストール
        run: pip install -r scraper/requirements.txt

      - name: 国税庁ホームページから取得して前回と比較
        run: |
          python3 scraper/build_dictionary.py --cache "$RUNNER_TEMP/nta-cache" \
            --only-if-changed --report "$RUNNER_TEMP/update-report.md"

      - name: 変更があればコミット
        id: commit
        run: |
          if git diff --quiet -- docs/data && [ -z "$(git status --porcelain -- docs/data)" ]; then
            echo "国税庁ホームページの内容に変更はありませんでした。" >> "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cat "$RUNNER_TEMP/update-report.md" >> "$GITHUB_STEP_SUMMARY"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git commit -F "$RUNNER_TEMP/update-report.md"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: GitHub Pages を再ビルド
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds"
